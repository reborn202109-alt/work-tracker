function migrateData(parsed) {
  if (!parsed || typeof parsed !== "object") return null;
  if (parsed.settings && parsed.settings.incomeCategories && parsed.settings.incomeCategories[0] && typeof parsed.settings.incomeCategories[0] === "string") {
    parsed.settings.incomeCategories = parsed.settings.incomeCategories.map(function(n) { return { name: n, color: "#818cf8" }; });
  }
  if (parsed.settings && !parsed.settings.fixedExpenses) parsed.settings.fixedExpenses = [];
  if (parsed.settings && !parsed.settings.holidays) parsed.settings.holidays = [];
  if (parsed.settings) parsed.settings.goalProject = Object.assign({}, GOAL_DEFAULT, parsed.settings.goalProject || {});
  return parsed;
}

async function loadDataFromSupabase() {
  const result = await sbClient.from("work_tracker_data").select("payload,updated_at").eq("user_id", USER_ID).maybeSingle();
  if (result.error) throw result.error;
  if (!result.data || !result.data.payload) return null;
  return {
    data: migrateData(JSON.parse(result.data.payload)),
    updatedAt: result.data.updated_at || ""
  };
}

async function saveDataToSupabase(d, updatedAt) {
  const stamp = updatedAt || new Date().toISOString();
  const result = await sbClient.from("work_tracker_data").upsert({
    user_id: USER_ID,
    payload: JSON.stringify(d),
    updated_at: stamp
  }, { onConflict: "user_id" });
  if (result.error) throw result.error;
  return stamp;
}

function calcHours(start, end, breakMinutes) {
  if (!start || !end) return 0;
  const sParts = start.split(":").map(Number);
  const eParts = end.split(":").map(Number);
  let mins = (eParts[0] * 60 + eParts[1]) - (sParts[0] * 60 + sParts[1]);
  if (mins < 0) mins += 24 * 60;
  mins = Math.max(0, mins - (Math.max(0, Number(breakMinutes) || 0)));
  return Math.round((mins / 60) * 100) / 100;
}
function calcDayHours(day) {
  day = day || {};
  const sessions = Array.isArray(day.workSessions) ? day.workSessions.filter(function(s) { return s && s.start && s.end; }) : [];
  if (sessions.length) return Math.round(sessions.reduce(function(sum, s) { return sum + calcHours(s.start, s.end, 0); }, 0) * 100) / 100;
  return calcHours(day.startTime, day.endTime, 0);
}
function fmt(n) { return (n == null ? 0 : n).toLocaleString("ko-KR"); }
function fmtHours(hours, compact) {
  const totalMinutes = Math.max(0, Math.round((Number(hours) || 0) * 60));
  const h = Math.floor(totalMinutes / 60), m = totalMinutes % 60;
  if (compact) return h + "h" + (m ? " " + m + "m" : "");
  if (!h) return m + "분";
  return h + "시간" + (m ? " " + m + "분" : "");
}
function toYMD(d) { return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
function getWorkDate(d) {
  const x = new Date(d.getTime());
  if (x.getHours() < 6) x.setDate(x.getDate() - 1);
  return toYMD(x);
}
function getMotivation(worked, goal) {
  if (!goal || !worked) return null;
  const arr = worked >= goal ? MOTIVATIONS_SUCCESS : MOTIVATIONS_FAIL;
  return arr[Math.floor(Math.random() * arr.length)];
}

function pad2(n) { return String(n).padStart(2, "0"); }

function addBusinessDays(dateStr, days, holidays) {
  holidays = holidays || [];
  const parts = dateStr.split("-").map(Number);
  const d = new Date(parts[0], parts[1] - 1, parts[2]);
  let added = 0;
  while (added < days) {
    d.setDate(d.getDate() + 1);
    const dow = d.getDay();
    const ymd = d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
    if (dow !== 0 && dow !== 6 && holidays.indexOf(ymd) === -1) added++;
  }
  return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
}

function coupangSettlementDate(dateStr, holidays) {
  holidays = holidays || [];
  const parts = dateStr.split("-").map(Number);
  const d = new Date(parts[0], parts[1] - 1, parts[2]);
  const dow = d.getDay();
  const daysSinceWed = (dow - 3 + 7) % 7;
  const fri = new Date(parts[0], parts[1] - 1, parts[2] - daysSinceWed + 9);
  function ymd() { return fri.getFullYear() + "-" + pad2(fri.getMonth() + 1) + "-" + pad2(fri.getDate()); }
  while (fri.getDay() === 0 || fri.getDay() === 6 || holidays.indexOf(ymd()) !== -1) fri.setDate(fri.getDate() + 1);
  return ymd();
}

function nextWeekday(dateStr, targetDow) {
  const d = new Date(dateStr + "T00:00:00");
  const cur = d.getDay();
  let diff = targetDow - cur;
  if (diff <= 0) diff += 7;
  d.setDate(d.getDate() + diff);
  return toYMD(d);
}

function calcSettlementDate(dateStr, cat, holidays) {
  if (!cat || !cat.settlementType) return null;
  if (cat.settlementType === "coupang") return coupangSettlementDate(dateStr, holidays);
  if (cat.settlementType === "weekday") return nextWeekday(dateStr, cat.settlementDow == null ? 5 : cat.settlementDow);
  if (cat.settlementType === "businessDays") return addBusinessDays(dateStr, cat.settlementDays == null ? 3 : cat.settlementDays, holidays);
  return null;
}

function buildSettlements(data) {
  const days = data.days, settings = data.settings;
  const holidays = settings.holidays || [];
  const list = [];
  Object.keys(days).forEach(function(dateStr) {
    const day = days[dateStr];
    (day.incomeItems || []).forEach(function(item) {
      const amt = Number(item.amount) || 0;
      if (!amt) return;
      const catObj = settings.incomeCategories.find(function(c) { return (c.name || c) === item.category; });
      const netAmt = item.taxable ? Math.round(amt * (1 - settings.taxRate / 100)) : amt;
      let settlDate = null;
      if (catObj && catObj.settlementType === "manual") {
        settlDate = item.settlementDate || null;
      } else {
        settlDate = calcSettlementDate(dateStr, catObj, holidays);
      }
      if (settlDate) list.push({ workDate: dateStr, settlDate: settlDate, category: item.category || "기타", title: item.title || "", amount: amt, netAmt: netAmt, taxable: item.taxable, color: (catObj && catObj.color) || "#818cf8" });
    });
  });
  list.sort(function(a, b) { return a.settlDate.localeCompare(b.settlDate); });
  return list;
}

function getPendingFixedExpenses(dateStr, data) {
  const ym = dateStr.slice(0, 7);
  const day = parseInt(dateStr.split("-")[2], 10);
  const paidThisMonth = [];
  Object.keys(data.days).forEach(function(k) {
    const d = data.days[k];
    (d.checkedFixedExpenses || []).forEach(function(entry) {
      if (entry.indexOf(ym + "_") === 0) paidThisMonth.push(entry.slice(ym.length + 1));
    });
  });
  return (data.settings.fixedExpenses || []).filter(function(fe) {
    if (paidThisMonth.indexOf(fe.id) !== -1) return false;
    return fe.dayOfMonth <= day;
  });
}

function parseGoalDate(dateStr) {
  const p = String(dateStr || "").split("-").map(Number);
  return new Date(p[0], (p[1] || 1) - 1, p[2] || 1);
}
function addGoalDays(dateStr, amount) {
  const d = parseGoalDate(dateStr);
  d.setDate(d.getDate() + amount);
  return toYMD(d);
}
function goalDateDiff(from, to) {
  return Math.round((parseGoalDate(to) - parseGoalDate(from)) / 86400000);
}
function isGoalWorkDay(dateStr, data, goal) {
  const day = data.days[dateStr] || {};
  if (day.startTime) return true;
  if (day.isOff) return false;
  if (goal.excludeFixedOffDays && (data.settings.fixedOffDays || []).indexOf(parseGoalDate(dateStr).getDay()) !== -1) return false;
  if (goal.excludeHolidays && (data.settings.holidays || []).indexOf(dateStr) !== -1) return false;
  return true;
}
function projectGoalFinish(startDate, workDays, data, goal) {
  if (!startDate || workDays <= 0) return startDate || "";
  let cursor = startDate, counted = 0;
  for (let guard = 0; guard < 30000; guard++) {
    if (isGoalWorkDay(cursor, data, goal)) counted++;
    if (counted >= workDays) return cursor;
    cursor = addGoalDays(cursor, 1);
  }
  return "";
}
function getGoalSummary(data) {
  const goal = Object.assign({}, GOAL_DEFAULT, data.settings.goalProject || {});
  const target = Math.max(0, Number(goal.targetAmount) || 0);
  const daily = Math.max(0, Number(goal.dailyAmount) || 0);
  let achieved = Math.max(0, Number(goal.startingAmount) || 0);
  let actualFinishDate = achieved >= target && target > 0 ? goal.startDate : "";
  Object.keys(data.days).sort().forEach(function(ds) {
    if (goal.startDate && ds < goal.startDate) return;
    achieved += Math.max(0, Number((data.days[ds] || {}).goalContribution) || 0);
    if (!actualFinishDate && target > 0 && achieved >= target) actualFinishDate = ds;
  });
  achieved = Math.min(achieved, target || achieved);
  const remaining = Math.max(0, target - achieved);
  const remainingWorkDays = daily > 0 ? Math.ceil(remaining / daily) : 0;
  const today = toYMD(new Date());
  const todayRecorded = Math.max(0, Number((data.days[today] || {}).goalContribution) || 0);
  const base = !goal.startDate || goal.startDate > today ? goal.startDate : (todayRecorded > 0 ? addGoalDays(today, 1) : today);
  const finishDate = remaining <= 0 ? actualFinishDate : projectGoalFinish(base, remainingWorkDays, data, goal);
  return { goal: goal, target: target, daily: daily, achieved: achieved, remaining: remaining, progress: target > 0 ? Math.min(100, achieved / target * 100) : 0, remainingWorkDays: remainingWorkDays, finishDate: finishDate, actualFinishDate: actualFinishDate, dday: finishDate ? goalDateDiff(today, finishDate) : null, scheduleDiff: goal.originalFinishDate && finishDate ? goalDateDiff(goal.originalFinishDate, finishDate) : 0 };
}

function loadDataLocalRecord() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return {
      data: migrateData(JSON.parse(raw)),
      updatedAt: localStorage.getItem(STORAGE_UPDATED_KEY) || ""
    };
  } catch (e) {}
  return { data: DEFAULT_DATA, updatedAt: "" };
}
function loadDataLocal() { return loadDataLocalRecord().data; }
function saveDataLocal(d, updatedAt) {
  const stamp = updatedAt || new Date().toISOString();
  localStorage.setItem(STORAGE_KEY, JSON.stringify(d));
  localStorage.setItem(STORAGE_UPDATED_KEY, stamp);
  return stamp;
}

function App() {
  const initialLocalRef = useRef(null);
  if (!initialLocalRef.current) initialLocalRef.current = loadDataLocalRecord();
  const [data, setData] = useState(function() { return initialLocalRef.current.data; });
  const [syncStatus, setSyncStatus] = useState("loading");
  const cloudReadyRef = useRef(false);
  const [tab, setTab] = useState("today");
  const [selectedDate, setSelectedDate] = useState(function() { return getWorkDate(new Date()); });
  const [calMonth, setCalMonth] = useState(function() { const d = new Date(); return { year: d.getFullYear(), month: d.getMonth() }; });
  const [timerRunning, setTimerRunning] = useState(false);
  const [timerStart, setTimerStart] = useState(null);
  const [timerElapsed, setTimerElapsed] = useState(0);
  const [showManualClock, setShowManualClock] = useState(false);
  const [manualClockTime, setManualClockTime] = useState("");
  const timerRef = useRef(null);
  const saveTimer = useRef(null);

  useEffect(function() {
    loadDataFromSupabase().then(function(cloudRecord) {
      const localRecord = initialLocalRef.current;
      const useCloud = cloudRecord && (!localRecord.updatedAt || cloudRecord.updatedAt > localRecord.updatedAt);
      const chosen = useCloud ? cloudRecord : localRecord;
      if (chosen && chosen.data) saveDataLocal(chosen.data, chosen.updatedAt || new Date().toISOString());
      cloudReadyRef.current = true;
      setSyncStatus("synced");
      setData(Object.assign({}, (chosen && chosen.data) || DEFAULT_DATA));
    }).catch(function(e) {
      console.error("Cloud load failed", e);
      cloudReadyRef.current = true;
      setSyncStatus("error");
      setData(function(current) { return Object.assign({}, current); });
    });
  }, []);

  useEffect(function() {
    if (!cloudReadyRef.current) return;
    const stamp = saveDataLocal(data);
    setSyncStatus("saving");
    clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(function() {
      saveDataToSupabase(data, stamp).then(function() {
        setSyncStatus("synced");
      }).catch(function(e) {
        console.error("Cloud save failed", e);
        setSyncStatus("error");
      });
    }, 1500);
    return function() { clearTimeout(saveTimer.current); };
  }, [data]);

  useEffect(function() {
    try {
      const saved = localStorage.getItem(TIMER_KEY);
      if (saved) {
        const parsed = JSON.parse(saved);
        setTimerStart(parsed.start);
        setTimerRunning(true);
      }
    } catch (e) {}
  }, []);

  useEffect(function() {
    if (timerRunning && timerStart) {
      const tick = function() {
        setTimerElapsed(Math.max(0, Math.floor((Date.now() - new Date(timerStart).getTime()) / 1000)));
      };
      tick();
      timerRef.current = setInterval(tick, 1000);
    } else {
      clearInterval(timerRef.current);
    }
    return function() { clearInterval(timerRef.current); };
  }, [timerRunning, timerStart]);

  const updateDay = useCallback(function(date, updater) {
    setData(function(prev) {
      const nextDays = Object.assign({}, prev.days);
      nextDays[date] = updater(prev.days[date] || {});
      return Object.assign({}, prev, { days: nextDays });
    });
  }, []);
  const updateSettings = useCallback(function(updater) {
    setData(function(prev) { return Object.assign({}, prev, { settings: updater(prev.settings) }); });
  }, []);

  const handleClockIn = function() {
    const now = new Date();
    const iso = now.toISOString();
    setTimerStart(iso); setTimerRunning(true); setTimerElapsed(0);
    localStorage.setItem(TIMER_KEY, JSON.stringify({ start: iso }));
    const todayStr = getWorkDate(now);
    updateDay(todayStr, function(d) {
      let sessions = Array.isArray(d.workSessions) ? d.workSessions.slice() : [];
      if (!sessions.length && d.startTime && d.endTime) sessions.push({ start: d.startTime, end: d.endTime });
      return Object.assign({}, d, { workSessions: sessions, startTime: pad2(now.getHours()) + ":" + pad2(now.getMinutes()), endTime: "", breakMinutes: 0 });
    });
    setSelectedDate(todayStr); setTab("today");
  };
  const handleManualClockIn = function() {
    const now = new Date();
    const todayStr = getWorkDate(now);
    const savedTime = (data.days[todayStr] || {}).startTime;
    const currentStart = timerStart ? new Date(timerStart) : null;
    const defaultTime = savedTime || (currentStart && !Number.isNaN(currentStart.getTime()) ? pad2(currentStart.getHours()) + ":" + pad2(currentStart.getMinutes()) : pad2(now.getHours()) + ":" + pad2(now.getMinutes()));
    setManualClockTime(defaultTime);
    setShowManualClock(true);
  };
  const saveManualClockIn = function() {
    const now = new Date();
    const todayStr = getWorkDate(now);
    const match = String(manualClockTime).trim().match(/^([01]?\d|2[0-3]):([0-5]\d)$/);
    if (!match) { alert("시간을 09:30처럼 입력하세요."); return; }
    const workParts = todayStr.split("-").map(Number);
    const inputHour = Number(match[1]);
    const start = new Date(workParts[0], workParts[1] - 1, workParts[2] + (inputHour < 6 ? 1 : 0), inputHour, Number(match[2]), 0, 0);
    if (start.getTime() > now.getTime()) { alert("현재 시간보다 뒤의 시간은 입력할 수 없어요."); return; }
    const iso = start.toISOString();
    setTimerStart(iso);
    setTimerRunning(true);
    setTimerElapsed(Math.floor((now.getTime() - start.getTime()) / 1000));
    localStorage.setItem(TIMER_KEY, JSON.stringify({ start: iso }));
    updateDay(todayStr, function(d) {
      let sessions = Array.isArray(d.workSessions) ? d.workSessions.slice() : [];
      if (!sessions.length && d.startTime && d.endTime) sessions.push({ start: d.startTime, end: d.endTime });
      return Object.assign({}, d, { workSessions: sessions, startTime: pad2(start.getHours()) + ":" + pad2(start.getMinutes()), endTime: "", breakMinutes: 0 });
    });
    setShowManualClock(false);
    setSelectedDate(todayStr); setTab("today");
  };
  const handleClockOut = function() {
    const now = new Date();
    setTimerRunning(false); localStorage.removeItem(TIMER_KEY);
    const todayStr = getWorkDate(now);
    updateDay(todayStr, function(d) {
      const end = pad2(now.getHours()) + ":" + pad2(now.getMinutes());
      let sessions = Array.isArray(d.workSessions) ? d.workSessions.slice() : [];
      if (d.startTime) sessions.push({ start: d.startTime, end: end });
      return Object.assign({}, d, { workSessions: sessions, startTime: sessions.length ? sessions[0].start : d.startTime, endTime: end, breakMinutes: 0 });
    });
    setTimerElapsed(0); setTimerStart(null);
  };

  function fmtTimer(s) {
    const a = Math.abs(s);
    return pad2(Math.floor(a / 3600)) + ":" + pad2(Math.floor((a % 3600) / 60)) + ":" + pad2(a % 60);
  }
  const isCountdown = data.settings.timerMode === "down";
  const goalSecs = (data.settings.dailyGoalHours || 0) * 3600;
  const displaySecs = isCountdown ? Math.max(goalSecs - timerElapsed, 0) : timerElapsed;
  const goalReached = isCountdown && timerElapsed >= goalSecs;
  const isDark = data.settings.theme !== "light";
  const T = isDark ? darkTheme : lightTheme;

  const tabs = [
    { id: "today", label: "📝 입력" },
    { id: "calendar", label: "🗓 달력" },
    { id: "settlement", label: "💳 정산" },
    { id: "stats", label: "📊 통계" },
    { id: "settings", label: "⚙️ 설정" }
  ];

  return (
    <div style={Object.assign({}, T.root, { fontFamily: "'Noto Sans KR', sans-serif", minHeight: "100vh" })}>
      <div style={T.header}>
        <div>
          <div style={T.headerTitle}>💼 나의 근무일지</div>
          <div style={T.headerDate}>{new Date().toLocaleDateString("ko-KR", { year: "numeric", month: "long", day: "numeric", weekday: "short" })}</div>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <div style={{ fontSize: 11, color: syncStatus === "synced" ? "#4ade80" : syncStatus === "saving" ? "#facc15" : syncStatus === "loading" ? "#94a3b8" : "#f87171" }}>
            {syncStatus === "synced" ? "☁️ 저장됨" : syncStatus === "saving" ? "⏳ 저장 중..." : syncStatus === "loading" ? "🔄 불러오는 중..." : "⚠️ 저장 실패"}
          </div>
          <button onClick={function() { updateSettings(function(s) { return Object.assign({}, s, { theme: s.theme === "light" ? "dark" : "light" }); }); }} style={{ background: "none", border: "none", fontSize: 20, cursor: "pointer" }}>
            {isDark ? "☀️" : "🌙"}
          </button>
        </div>
      </div>

      <div style={T.timerBar}>
        {timerRunning ? (
          <React.Fragment>
            <div style={{ display: "flex", flexDirection: "column", gap: 2 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 22, fontWeight: 800, color: goalReached ? "#facc15" : isCountdown ? "#f87171" : "#4ade80", fontVariantNumeric: "tabular-nums" }}>
                <span style={{ width: 8, height: 8, borderRadius: "50%", display: "inline-block", background: goalReached ? "#facc15" : isCountdown ? "#f87171" : "#4ade80" }} />
                {fmtTimer(displaySecs)}
              </div>
              <div style={{ fontSize: 11, color: T.muted }}>{goalReached ? "🎉 목표 달성!" : isCountdown ? "⬇️ 카운트다운" : "⬆️ 카운트업"}</div>
            </div>
            <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
              <button onClick={handleManualClockIn} style={{ padding: "7px 10px", background: "rgba(129,140,248,0.14)", border: "1px solid rgba(129,140,248,0.35)", borderRadius: 16, color: "#a5b4fc", fontSize: 11, cursor: "pointer" }}>시작시간 수정</button>
              <button onClick={handleClockOut} style={T.clockOutBtn}>🏁 퇴근</button>
            </div>
          </React.Fragment>
        ) : (
          <React.Fragment>
            <div style={{ fontSize: 12, color: T.muted }}>{isCountdown ? ("⬇️ 카운트다운 (목표 " + data.settings.dailyGoalHours + "h)") : "⬆️ 카운트업"}</div>
            <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
              <button onClick={handleManualClockIn} style={{ padding: "7px 10px", background: "rgba(129,140,248,0.14)", border: "1px solid rgba(129,140,248,0.35)", borderRadius: 16, color: "#a5b4fc", fontSize: 11, cursor: "pointer" }}>놓쳤다면 시간입력</button>
              <button onClick={handleClockIn} style={T.clockInBtn}>▶ 출근 시작</button>
            </div>
          </React.Fragment>
        )}
      </div>

      {showManualClock && (
        <div onClick={function() { setShowManualClock(false); }} style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.72)", zIndex: 100, display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>
          <div onClick={function(e) { e.stopPropagation(); }} style={Object.assign({}, T.card, { width: "100%", maxWidth: 360, padding: 20, boxShadow: "0 18px 50px rgba(0,0,0,0.45)" })}>
            <div style={{ fontSize: 17, fontWeight: 800, marginBottom: 6 }}>⏰ 실제 출근시간 입력</div>
            <div style={{ fontSize: 12, color: T.muted, marginBottom: 14 }}>입력한 시간부터 현재까지 타이머를 다시 계산해요.</div>
            <input type="time" value={manualClockTime} onChange={function(e) { setManualClockTime(e.target.value); }} style={Object.assign({}, T.input, { fontSize: 22, textAlign: "center", padding: 12 })} />
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginTop: 14 }}>
              <button onClick={function() { setShowManualClock(false); }} style={{ padding: 11, borderRadius: 9, border: "1px solid " + T.divider, background: "transparent", color: T.muted, cursor: "pointer" }}>취소</button>
              <button onClick={saveManualClockIn} style={T.primaryBtn}>이 시간부터 시작</button>
            </div>
          </div>
        </div>
      )}

      <div style={T.tabBar}>
        {tabs.map(function(t) {
          return <button key={t.id} onClick={function() { setTab(t.id); }} style={Object.assign({}, T.tabBtn, tab === t.id ? T.tabBtnActive : {})}>{t.label}</button>;
        })}
      </div>

      <div style={{ padding: "12px 12px 80px" }}>
        {tab === "today" && <DayInput date={selectedDate} setDate={setSelectedDate} data={data} updateDay={updateDay} T={T} />}
        {tab === "calendar" && <CalendarView data={data} calMonth={calMonth} setCalMonth={setCalMonth} setSelectedDate={function(d) { setSelectedDate(d); setTab("today"); }} T={T} />}
        {tab === "settlement" && <SettlementView data={data} T={T} />}
        {tab === "stats" && <StatsView data={data} T={T} />}
        {tab === "settings" && <SettingsView data={data} updateSettings={updateSettings} T={T} />}
      </div>
    </div>
  );
}

function DayInput(props) {
  const date = props.date, setDate = props.setDate, data = props.data, updateDay = props.updateDay, T = props.T;
  const settings = data.settings;
  const day = data.days[date] || {};
  const income = day.incomeItems || [];
  const expenseItems = day.expenseItems || [];
  const worked = calcDayHours(day);
  const totalIncome = income.reduce(function(s, i) { return s + (Number(i.amount) || 0); }, 0);
  const taxDeducted = income.reduce(function(s, i) { const a = Number(i.amount) || 0; return s + (i.taxable ? a * (1 - settings.taxRate / 100) : a); }, 0);
  const totalExpense = expenseItems.reduce(function(s, i) { return s + (Number(i.amount) || 0); }, 0);
  const motivation = (worked > 0 && settings.dailyGoalHours) ? getMotivation(worked, settings.dailyGoalHours) : null;
  function set(field, val) { updateDay(date, function(d) { const next = Object.assign({}, d); next[field] = val; return next; }); }
  const isFixedOff = settings.fixedOffDays.indexOf(new Date(date + "T00:00:00").getDay()) !== -1;
  const pendingFixed = getPendingFixedExpenses(date, data);
  const goalSummary = getGoalSummary(data);
  const goal = goalSummary.goal;
  const [goalInput, setGoalInput] = useState("");
  useEffect(function() { setGoalInput(day.goalContribution == null ? "" : String(day.goalContribution)); }, [date, day.goalContribution]);

  function checkFixedExpense(fe) {
    const ym = date.slice(0, 7);
    updateDay(date, function(d) {
      const items = (d.expenseItems || []).concat([{ category: fe.category || "고정지출", title: fe.name, amount: fe.amount, isFixed: true }]);
      const checked = (d.checkedFixedExpenses || []).concat([ym + "_" + fe.id]);
      return Object.assign({}, d, { expenseItems: items, checkedFixedExpenses: checked });
    });
  }
  function saveWorkSessions(sessions) {
    updateDay(date, function(d) {
      const valid = sessions.slice();
      const first = valid.find(function(s) { return s.start; });
      const ended = valid.filter(function(s) { return s.end; });
      return Object.assign({}, d, { workSessions: valid, startTime: first ? first.start : "", endTime: ended.length ? ended[ended.length - 1].end : "", breakMinutes: 0 });
    });
  }
  function addWorkSession() {
    let sessions = Array.isArray(day.workSessions) ? day.workSessions.slice() : [];
    if (!sessions.length && (day.startTime || day.endTime)) sessions.push({ start: day.startTime || "", end: day.endTime || "" });
    sessions.push({ start: "", end: "" });
    saveWorkSessions(sessions);
  }

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
      <div style={T.card}>
        <label style={T.label}>날짜 선택</label>
        <input type="date" value={date} onChange={function(e) { setDate(e.target.value); }} style={T.input} />
        {isFixedOff && !day.isOff && <div style={T.offBadge}>🛌 고정 휴일</div>}
      </div>

      {goal.enabled && date >= goal.startDate && (
        <div style={Object.assign({}, T.card, { border: "1px solid rgba(250,204,21,0.28)", background: "linear-gradient(135deg,rgba(250,204,21,0.08),rgba(129,140,248,0.06))" })}>
          <div style={{ display: "flex", justifyContent: "space-between", gap: 10, alignItems: "flex-start" }}>
            <div>
              <div style={{ fontSize: 12, color: "#facc15", fontWeight: 700 }}>🏁 {goal.name}</div>
              <div style={{ fontSize: 11, color: T.muted, marginTop: 4 }}>달성 {fmt(goalSummary.achieved)}원 · 남음 {fmt(goalSummary.remaining)}원</div>
            </div>
            <div style={{ textAlign: "right", fontSize: 11, color: "#c4b5fd" }}>
              {goalSummary.remaining <= 0 ? "목표 완료" : goalSummary.remainingWorkDays + "번 출근 남음"}
            </div>
          </div>
          <div style={{ height: 7, borderRadius: 9, background: "rgba(255,255,255,0.08)", overflow: "hidden", margin: "10px 0" }}>
            <div style={{ height: "100%", width: goalSummary.progress + "%", background: "linear-gradient(90deg,#818cf8,#facc15)", borderRadius: 9 }} />
          </div>
          <div style={{ display: "flex", gap: 7 }}>
            <input type="number" min="0" value={goalInput} onChange={function(e) { setGoalInput(e.target.value); }} placeholder={"오늘 목표 " + fmt(goal.dailyAmount) + "원"} style={Object.assign({}, T.input, { flex: 1 })} />
            <button onClick={function() { const amount = Math.max(0, Number(goalInput || goal.dailyAmount) || 0); set("goalContribution", amount); setGoalInput(String(amount)); }} style={Object.assign({}, T.primaryBtn, { width: "auto", padding: "0 14px" })}>기록</button>
          </div>
          <div style={{ display: "flex", justifyContent: "space-between", marginTop: 8, fontSize: 10, color: T.muted }}>
            <span>비워두고 기록하면 하루 목표액 입력</span>
            {day.goalContribution > 0 && <button onClick={function() { set("goalContribution", 0); setGoalInput(""); }} style={{ border: 0, background: "transparent", color: "#f87171", cursor: "pointer" }}>기록 취소</button>}
          </div>
          {goalSummary.finishDate && <div style={{ marginTop: 10, paddingTop: 9, borderTop: "1px solid rgba(255,255,255,0.08)", display: "flex", justifyContent: "space-between", fontSize: 11 }}><span style={{ color: T.muted }}>예상 완료일</span><b style={{ color: "#facc15" }}>{goalSummary.finishDate} · {goalSummary.remaining <= 0 ? "완료" : goalSummary.dday === 0 ? "D-DAY" : goalSummary.dday > 0 ? "D-" + goalSummary.dday : "D+" + Math.abs(goalSummary.dday)}</b></div>}
          {goalSummary.scheduleDiff !== 0 && goalSummary.remaining > 0 && <div style={{ marginTop: 5, textAlign: "right", fontSize: 10, color: goalSummary.scheduleDiff < 0 ? "#4ade80" : "#fb923c" }}>{goalSummary.scheduleDiff < 0 ? Math.abs(goalSummary.scheduleDiff) + "일 앞당김" : goalSummary.scheduleDiff + "일 지연"}</div>}
        </div>
      )}

      <div style={T.card}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <span style={T.label}>휴무일 설정</span>
          <label style={{ display: "flex", alignItems: "center", cursor: "pointer", fontSize: 13 }}>
            <input type="checkbox" checked={!!day.isOff} onChange={function(e) { set("isOff", e.target.checked); }} />
            <span style={{ marginLeft: 6 }}>{day.isOff ? "🚫 휴무" : "✅ 근무"}</span>
          </label>
        </div>
        {day.isOff && <input placeholder="휴무 사유..." value={day.offReason || ""} onChange={function(e) { set("offReason", e.target.value); }} style={Object.assign({}, T.input, { marginTop: 8 })} />}
      </div>

      {!day.isOff && (
        <div style={T.card}>
          <div style={T.label}>⏰ 근무 시간</div>
          {!(day.workSessions || []).length && <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
            <div style={{ flex: 1 }}>
              <div style={T.subLabel}>출근</div>
              <input type="time" value={day.startTime || ""} onChange={function(e) { const value=e.target.value; updateDay(date,function(d){return Object.assign({},d,{startTime:value,workSessions:[]});}); }} style={T.input} />
            </div>
            <div style={{ fontSize: 18, paddingTop: 16 }}>→</div>
            <div style={{ flex: 1 }}>
              <div style={T.subLabel}>퇴근</div>
              <input type="time" value={day.endTime || ""} onChange={function(e) { const value=e.target.value; updateDay(date,function(d){return Object.assign({},d,{endTime:value,workSessions:[]});}); }} style={T.input} />
            </div>
          </div>}
          {(day.workSessions || []).length > 0 && <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>{day.workSessions.map(function(s, i) { return <div key={i} style={{ padding: "9px", borderRadius: 9, background: "rgba(129,140,248,0.07)" }}><div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}><span style={{ fontSize: 11, fontWeight: 700, color: "#a5b4fc" }}>{i + 1}차 근무</span><button onClick={function() { saveWorkSessions(day.workSessions.filter(function(_, j) { return j !== i; })); }} style={T.delBtn}>삭제</button></div><div style={{ display: "grid", gridTemplateColumns: "1fr auto 1fr", gap: 7, alignItems: "center" }}><input type="time" value={s.start || ""} onChange={function(e) { const next=day.workSessions.slice(); next[i]=Object.assign({},next[i],{start:e.target.value}); saveWorkSessions(next); }} style={T.input} /><span>→</span><input type="time" value={s.end || ""} onChange={function(e) { const next=day.workSessions.slice(); next[i]=Object.assign({},next[i],{end:e.target.value}); saveWorkSessions(next); }} style={T.input} /></div>{s.start && s.end && <div style={{ textAlign: "right", fontSize: 10, color: T.muted, marginTop: 5 }}>{fmtHours(calcHours(s.start, s.end, 0))}</div>}</div>; })}</div>}
          <button onClick={addWorkSession} style={Object.assign({}, T.addBtn, { width: "100%", marginTop: 9 })}>+ 근무 구간 추가</button>
          {worked > 0 && (
            <div style={T.resultBox}>
              <span>⏱ 합산 근무: <b>{fmtHours(worked)}</b></span>
              {settings.dailyGoalHours > 0 && <span>목표 {fmtHours(settings.dailyGoalHours)} {worked >= settings.dailyGoalHours ? "✅" : ("❌ (" + fmtHours(settings.dailyGoalHours - worked) + " 부족)")}</span>}
            </div>
          )}
          {motivation && <div style={T.motivationBox}>{motivation}</div>}
        </div>
      )}

      <div style={T.card}>
        <div style={T.label}>💰 수입 내역</div>
        {income.map(function(item, i) {
          const catObj = settings.incomeCategories.find(function(c) { return (c.name || c) === item.category; });
          const catColor = (catObj && catObj.color) || "#818cf8";
          return (
            <div key={i} style={{ marginBottom: 10 }}>
              <div style={{ display: "flex", gap: 6, marginBottom: 4, alignItems: "center" }}>
                <select value={item.category || ""} onChange={function(e) { const next = income.slice(); next[i] = Object.assign({}, next[i], { category: e.target.value }); set("incomeItems", next); }} style={Object.assign({}, T.input, { flex: 1.2, borderLeft: "3px solid " + catColor })}>
                  <option value="">카테고리</option>
                  {settings.incomeCategories.map(function(c) { return <option key={c.name || c} value={c.name || c}>{c.name || c}</option>; })}
                </select>
                {item.category === "기타수입" && <input placeholder="제목" value={item.title || ""} onChange={function(e) { const next = income.slice(); next[i] = Object.assign({}, next[i], { title: e.target.value }); set("incomeItems", next); }} style={Object.assign({}, T.input, { flex: 1.5 })} />}
                <button onClick={function() { set("incomeItems", income.filter(function(_, j) { return j !== i; })); }} style={T.delBtn}>✕</button>
              </div>
              <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
                <input type="number" placeholder="금액" value={item.amount || ""} onChange={function(e) { const next = income.slice(); next[i] = Object.assign({}, next[i], { amount: e.target.value }); set("incomeItems", next); }} style={Object.assign({}, T.input, { flex: 1 })} />
                <label style={{ display: "flex", alignItems: "center", gap: 3, fontSize: 11, whiteSpace: "nowrap" }}>
                  <input type="checkbox" checked={!!item.taxable} onChange={function(e) { const next = income.slice(); next[i] = Object.assign({}, next[i], { taxable: e.target.checked }); set("incomeItems", next); }} />3.3%
                </label>
              </div>
              {catObj && catObj.settlementType === "manual" && (
                <div style={{ marginTop: 4, display: "flex", alignItems: "center", gap: 6 }}>
                  <span style={{ fontSize: 11, color: T.muted, whiteSpace: "nowrap" }}>🗓 정산 예정일</span>
                  <input type="date" value={item.settlementDate || ""} onChange={function(e) { const next = income.slice(); next[i] = Object.assign({}, next[i], { settlementDate: e.target.value }); set("incomeItems", next); }} style={Object.assign({}, T.input, { flex: 1 })} />
                </div>
              )}
              {catObj && catObj.settlementType && catObj.settlementType !== "manual" && item.amount && (
                <div style={{ marginTop: 4, fontSize: 11, color: catColor }}>🗓 정산 예정: {calcSettlementDate(date, catObj, settings.holidays)}</div>
              )}
            </div>
          );
        })}
        <button onClick={function() { set("incomeItems", income.concat([{ category: "", title: "", amount: "", taxable: false }])); }} style={T.addBtn}>+ 수입 추가</button>
        {totalIncome > 0 && (
          <div style={T.resultBox}>
            <div>총 수입: <b>₩{fmt(totalIncome)}</b></div>
            <div>세후: <b style={{ color: "#4ade80" }}>₩{fmt(Math.round(taxDeducted))}</b></div>
          </div>
        )}
      </div>

      <div style={T.card}>
        <div style={T.label}>💸 지출 내역</div>

        {pendingFixed.length > 0 && (
          <div style={{ marginBottom: 12, padding: "10px 12px", background: "rgba(249,115,22,0.08)", borderRadius: 10, border: "1px solid rgba(249,115,22,0.3)" }}>
            <div style={{ fontSize: 12, color: "#f97316", fontWeight: 600, marginBottom: 8 }}>📌 납부 예정 고정 지출</div>
            {pendingFixed.map(function(fe) {
              return (
                <div key={fe.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
                  <div>
                    <span style={{ fontSize: 13 }}>{fe.name}</span>
                    <span style={{ fontSize: 11, color: T.muted, marginLeft: 6 }}>₩{fmt(fe.amount)}</span>
                  </div>
                  <button onClick={function() { checkFixedExpense(fe); }} style={{ padding: "4px 10px", background: "rgba(74,222,128,0.15)", border: "1px solid rgba(74,222,128,0.3)", borderRadius: 6, color: "#4ade80", fontSize: 12, cursor: "pointer" }}>납부 ✓</button>
                </div>
              );
            })}
          </div>
        )}

        {expenseItems.map(function(item, i) {
          return (
            <div key={i} style={{ marginBottom: 10, borderLeft: item.isFixed ? "3px solid #f97316" : "3px solid transparent", paddingLeft: item.isFixed ? 8 : 0 }}>
              <div style={{ display: "flex", gap: 6, marginBottom: 4, alignItems: "center" }}>
                <select value={item.category || ""} onChange={function(e) { const next = expenseItems.slice(); next[i] = Object.assign({}, next[i], { category: e.target.value === "__direct__" ? "" : e.target.value }); set("expenseItems", next); }} style={Object.assign({}, T.input, { flex: 1 })}>
                  <option value="">카테고리 선택</option>
                  {settings.expenseCategories.map(function(c) { return <option key={c} value={c}>{c}</option>; })}
                  <option value="고정지출">고정지출</option>
                  <option value="기타">기타</option>
                </select>
                <button onClick={function() { set("expenseItems", expenseItems.filter(function(_, j) { return j !== i; })); }} style={T.delBtn}>✕</button>
              </div>
              <div style={{ display: "flex", gap: 6 }}>
                <input placeholder="제목 (선택)" value={item.title || ""} onChange={function(e) { const next = expenseItems.slice(); next[i] = Object.assign({}, next[i], { title: e.target.value }); set("expenseItems", next); }} style={Object.assign({}, T.input, { flex: 1.5 })} />
                <input type="number" placeholder="금액" value={item.amount || ""} onChange={function(e) { const next = expenseItems.slice(); next[i] = Object.assign({}, next[i], { amount: e.target.value }); set("expenseItems", next); }} style={Object.assign({}, T.input, { flex: 1 })} />
              </div>
            </div>
          );
        })}
        <button onClick={function() { set("expenseItems", expenseItems.concat([{ category: "", title: "", amount: "" }])); }} style={T.addBtn}>+ 지출 추가</button>
        {totalExpense > 0 && <div style={Object.assign({}, T.resultBox, { marginTop: 10 })}>총 지출: <b style={{ color: "#f87171" }}>₩{fmt(totalExpense)}</b></div>}
      </div>

      <div style={T.card}>
        <div style={T.label}>🌤 날씨 & 하루 메모</div>
        <div style={{ display: "flex", gap: 8, marginBottom: 10 }}>
          {WEATHER_OPTIONS.map(function(w) {
            return <button key={w.label} onClick={function() { set("weather", w.label); }} style={{ fontSize: 22, background: day.weather === w.label ? "rgba(129,140,248,0.15)" : "rgba(255,255,255,0.05)", border: day.weather === w.label ? "2px solid #818cf8" : "2px solid transparent", borderRadius: 10, padding: "6px 10px", cursor: "pointer" }}>{w.icon}</button>;
          })}
        </div>
        <textarea placeholder="오늘 하루 어땠어요? ✍️" value={day.memo || ""} onChange={function(e) { set("memo", e.target.value); }} style={T.textarea} rows={4} />
        <div style={{ marginTop: 10 }}>
          <div style={T.subLabel}>📸 사진 첨부</div>
          <label style={Object.assign({}, T.addBtn, { display: "inline-block", marginTop: 6, cursor: "pointer" })}>
            📷 사진 추가
            <input type="file" accept="image/*" multiple style={{ display: "none" }} onChange={function(e) {
              Array.prototype.forEach.call(e.target.files, function(file) {
                const reader = new FileReader();
                reader.onload = function(ev) {
                  updateDay(date, function(d) {
                    const photos = (d.photos || []).concat([{ data: ev.target.result, name: file.name }]);
                    return Object.assign({}, d, { photos: photos });
                  });
                };
                reader.readAsDataURL(file);
              });
            }} />
          </label>
          {(day.photos || []).length > 0 && (
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginTop: 8 }}>
              {(day.photos || []).map(function(p, i) {
                return (
                  <div key={i} style={{ position: "relative" }}>
                    <img src={p.data} alt={p.name} style={{ width: 72, height: 72, objectFit: "cover", borderRadius: 8, border: "1px solid rgba(255,255,255,0.1)" }} />
                    <button onClick={function() { updateDay(date, function(d) { return Object.assign({}, d, { photos: (d.photos || []).filter(function(_, j) { return j !== i; }) }); }); }} style={{ position: "absolute", top: -6, right: -6, background: "#ef4444", border: "none", borderRadius: "50%", width: 18, height: 18, color: "#fff", fontSize: 10, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" }}>✕</button>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      </div>

      {(totalIncome > 0 || worked > 0 || totalExpense > 0) && (
        <div style={T.summaryCard}>
          <div style={T.summaryTitle}>📋 오늘 요약</div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(3,1fr)", gap: 10 }}>
            <SI label="근무" value={fmtHours(worked)} />
            <SI label="수입" value={"₩" + fmt(totalIncome)} />
            <SI label="실수령" value={"₩" + fmt(Math.round(taxDeducted))} color="#4ade80" />
            <SI label="지출" value={"₩" + fmt(totalExpense)} color="#f87171" />
            <SI label="순수익" value={"₩" + fmt(Math.round(taxDeducted) - totalExpense)} color={(taxDeducted - totalExpense >= 0) ? "#4ade80" : "#f87171"} />
            {worked > 0 && totalIncome > 0 && <SI label="시급" value={"₩" + fmt(Math.round(totalIncome / worked))} color="#facc15" />}
          </div>
        </div>
      )}
    </div>
  );
}

function CalendarView(props) {

  const goalSummary = getGoalSummary(data);

          {cells.map(function(d, i) {

            const isToday = ds === today;
            const goalMet = worked >= settings.dailyGoalHours;
            const isFixed = settings.fixedOffDays.indexOf(new Date(ds + "T00:00:00").getDay()) !== -1;
            const hasPendingFixed = getPendingFixedExpenses(ds, data).length > 0;
            const isGoalStart = goal.enabled && ds === goal.startDate;

                <div style={{ fontSize: 13, fontWeight: isToday ? 700 : 400 }}>{d}</div>
                {isToday && <div title="오늘" style={{ width: 5, height: 5, borderRadius: "50%", background: "#818cf8", boxShadow: "0 0 6px rgba(129,140,248,0.7)", flexShrink: 0 }} />}

                {isGoalFinish && <div title="예상 목표일" style={{ fontSize: 11, lineHeight: 1 }}>🏁</div>}
                {worked > 0 && <div style={{ fontSize: 9, color: goalMet ? "#4ade80" : "#f87171" }}>{fmtHours(worked, true)}</div>}
                {hasIncome && <div style={{ fontSize: 9 }}>💰</div>}
                {dd.isOff && <div style={{ fontSize: 9 }}>🚫</div>}
                {dd.weather && <div style={{ fontSize: 9 }}>{(WEATHER_OPTIONS.find(function(w) { return w.label === dd.weather; }) || {}).icon}</div>}
                {(dd.photos || []).length > 0 && <div style={{ fontSize: 9 }}>📸</div>}
                {hasPendingFixed && <div style={{ fontSize: 9 }}>📌</div>}
              </div>
            );
          })}
        </div>
      </div>
      <MonthSummary data={data} year={year} month={month} T={T} />
    </div>
  );
}

function MonthSummary(props) {
  const data = props.data, year = props.year, month = props.month, T = props.T;
  const days = data.days, settings = data.settings;
  const prefix = year + "-" + pad2(month + 1);
  let totalWorked = 0, totalIncome = 0, totalTaxed = 0, totalExpense = 0, workDays = 0;
  Object.keys(days).filter(function(k) { return k.indexOf(prefix) === 0; }).forEach(function(k) {
    const d = days[k];
    const w = calcDayHours(d);
    if (w > 0) { totalWorked += w; workDays++; }
    (d.incomeItems || []).forEach(function(i) { const a = Number(i.amount) || 0; totalIncome += a; totalTaxed += i.taxable ? a * (1 - settings.taxRate / 100) : a; });
    (d.expenseItems || []).forEach(function(i) { totalExpense += Number(i.amount) || 0; });
  });
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const now = new Date();
  const isCurrent = now.getFullYear() === year && now.getMonth() === month;
  let predicted = null;
  if (isCurrent && workDays > 0) {
    let remain = 0;
    for (let d = now.getDate() + 1; d <= daysInMonth; d++) {
      const ds = year + "-" + pad2(month + 1) + "-" + pad2(d);
      if (settings.fixedOffDays.indexOf(new Date(ds + "T00:00:00").getDay()) === -1 && !((days[ds] || {}).isOff)) remain++;
    }
    predicted = totalIncome + (totalIncome / workDays) * remain;
  }
  const goalIncome = settings.monthlyGoalIncome || 0;
  const goalPct = goalIncome > 0 ? Math.min(Math.round((totalTaxed / goalIncome) * 100), 100) : null;
  return (
    <div style={T.summaryCard}>
      <div style={T.summaryTitle}>{month + 1}월 요약</div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(3,1fr)", gap: 10 }}>
        <SI label="근무일" value={workDays + "일"} />
        <SI label="총 근무" value={fmtHours(totalWorked)} />
        <SI label="총 수입" value={"₩" + fmt(Math.round(totalIncome))} />
        <SI label="세후 수입" value={"₩" + fmt(Math.round(totalTaxed))} color="#4ade80" />
        <SI label="총 지출" value={"₩" + fmt(Math.round(totalExpense))} color="#f87171" />
        <SI label="순수익" value={"₩" + fmt(Math.round(totalTaxed - totalExpense))} color={(totalTaxed - totalExpense >= 0) ? "#4ade80" : "#f87171"} />
      </div>
      {goalPct !== null && (
        <div style={{ marginTop: 12 }}>
          <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, marginBottom: 4 }}>
            <span>월 목표 달성률</span><span style={{ color: "#facc15", fontWeight: 700 }}>{goalPct}%</span>
          </div>
          <div style={{ background: "rgba(255,255,255,0.08)", borderRadius: 4, height: 8 }}>
            <div style={{ width: goalPct + "%", height: "100%", borderRadius: 4, background: "linear-gradient(90deg,#818cf8,#facc15)", transition: "width 0.5s" }} />
          </div>
          <div style={{ fontSize: 11, color: T.muted, marginTop: 4 }}>목표: ₩{fmt(goalIncome)}</div>
        </div>
      )}
      {predicted !== null && (
        <div style={{ marginTop: 10, padding: "8px 12px", background: "rgba(250,204,21,0.08)", borderRadius: 8, fontSize: 13, color: "#facc15", textAlign: "center" }}>
          📈 이번 달 예상 수입: <b>₩{fmt(Math.round(predicted))}</b>
        </div>
      )}
    </div>
  );
}

function SettlementView(props) {
  const data = props.data, T = props.T;
  const today = toYMD(new Date());
  const settlements = buildSettlements(data);
  const upcoming = settlements.filter(function(s) { return s.settlDate >= today; });
  const past = settlements.filter(function(s) { return s.settlDate < today; });
  const totalUpcoming = upcoming.reduce(function(s, i) { return s + i.netAmt; }, 0);
  const totalPast = past.reduce(function(s, i) { return s + i.netAmt; }, 0);

  function groupByDate(arr) {
    const grouped = {};
    arr.forEach(function(s) {
      if (!grouped[s.settlDate]) grouped[s.settlDate] = [];
      grouped[s.settlDate].push(s);
    });
    return grouped;
  }

  const upcomingGrouped = groupByDate(upcoming);
  const upcomingDates = Object.keys(upcomingGrouped).sort();
  const pastGrouped = groupByDate(past);
  const pastDates = Object.keys(pastGrouped).sort().reverse();

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
      <div style={T.summaryCard}>
        <div style={T.summaryTitle}>💳 정산 현황</div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(2,1fr)", gap: 10 }}>
          <SI label="예정 정산 합계" value={"₩" + fmt(totalUpcoming)} color="#4ade80" />
          <SI label="완료 정산 합계" value={"₩" + fmt(totalPast)} color="#64748b" />
        </div>
      </div>
      <div style={T.card}>
        <div style={T.label}>⏳ 다가오는 정산 ({upcomingDates.length}일, {upcoming.length}건)</div>
        {upcomingDates.length === 0 && <div style={{ fontSize: 13, color: T.muted }}>예정된 정산이 없어요</div>}
        {upcomingDates.map(function(date) {
          const items = upcomingGrouped[date];
          const totalNet = items.reduce(function(s, i) { return s + i.netAmt; }, 0);
          const totalAmt = items.reduce(function(s, i) { return s + i.amount; }, 0);
          const isToday = date === today;
          const dp = date.split("-").map(Number);
          const d = new Date(dp[0], dp[1] - 1, dp[2]);
          const tp = today.split("-").map(Number);
          const t = new Date(tp[0], tp[1] - 1, tp[2]);
          const diff = Math.round((d - t) / 86400000);
          return (
            <div key={date} style={{ borderRadius: 10, marginBottom: 10, background: isToday ? "rgba(74,222,128,0.08)" : "rgba(255,255,255,0.03)", border: "1px solid " + (isToday ? "rgba(74,222,128,0.3)" : "rgba(255,255,255,0.06)"), overflow: "hidden" }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "10px 12px", borderBottom: items.length > 1 ? "1px solid rgba(255,255,255,0.06)" : "none" }}>
                <div>
                  <div style={{ fontSize: 13, fontWeight: 700 }}>
                    {date.slice(5).replace("-", "/")} ({WEEKDAYS[d.getDay()]})
                    {isToday && <span style={{ color: "#4ade80", marginLeft: 6 }}>● 오늘!</span>}
                    {diff === 1 && <span style={{ color: "#facc15", marginLeft: 6 }}>● 내일!</span>}
                    {diff > 1 && diff <= 7 && <span style={{ color: T.muted, marginLeft: 6 }}>{diff}일 후</span>}
                  </div>
                  <div style={{ fontSize: 11, color: T.muted, marginTop: 2 }}>{items.length}건</div>
                </div>
                <div style={{ textAlign: "right" }}>
                  {totalAmt !== totalNet && <div style={{ fontSize: 11, color: T.muted, textDecoration: "line-through" }}>₩{fmt(totalAmt)}</div>}
                  <div style={{ fontSize: 16, fontWeight: 800, color: "#4ade80" }}>₩{fmt(totalNet)}</div>
                </div>
              </div>
              {items.map(function(s, i) {
                return (
                  <div key={i} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "7px 12px", borderBottom: i < items.length - 1 ? "1px solid rgba(255,255,255,0.04)" : "none", background: "rgba(0,0,0,0.1)" }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                      <div style={{ width: 8, height: 8, borderRadius: "50%", background: s.color, flexShrink: 0 }} />
                      <div>
                        <div style={{ fontSize: 12 }}>{s.category}{s.title ? (" · " + s.title) : ""}</div>
                        <div style={{ fontSize: 10, color: T.muted }}>일한 날: {s.workDate.slice(5).replace("-", "/")}</div>
                      </div>
                    </div>
                    <div style={{ fontSize: 13, fontWeight: 600, color: "#4ade80" }}>₩{fmt(s.netAmt)}</div>
                  </div>
                );
              })}
            </div>
          );
        })}
      </div>
      {past.length > 0 && (
        <div style={T.card}>
          <div style={T.label}>✅ 완료된 정산 ({pastDates.length}일, {past.length}건)</div>
          {pastDates.map(function(date) {
            const items = pastGrouped[date];
            const totalNet = items.reduce(function(s, i) { return s + i.netAmt; }, 0);
            const dp = date.split("-").map(Number);
            const d = new Date(dp[0], dp[1] - 1, dp[2]);
            return (
              <div key={date} style={{ borderRadius: 10, marginBottom: 8, background: "rgba(255,255,255,0.02)", border: "1px solid rgba(255,255,255,0.04)", overflow: "hidden", opacity: 0.7 }}>
                <div style={{ display: "flex", justifyContent: "space-between", padding: "8px 12px", borderBottom: items.length > 1 ? "1px solid rgba(255,255,255,0.04)" : "none" }}>
                  <div style={{ fontSize: 12, fontWeight: 600 }}>{date.slice(5).replace("-", "/")} ({WEEKDAYS[d.getDay()]})</div>
                  <div style={{ fontSize: 13, fontWeight: 700, color: T.muted }}>₩{fmt(totalNet)}</div>
                </div>
                {items.map(function(s, i) {
                  return (
                    <div key={i} style={{ display: "flex", justifyContent: "space-between", padding: "6px 12px", background: "rgba(0,0,0,0.1)", borderBottom: i < items.length - 1 ? "1px solid rgba(255,255,255,0.03)" : "none" }}>
                      <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                        <div style={{ width: 7, height: 7, borderRadius: "50%", background: s.color }} />
                        <span style={{ fontSize: 11 }}>{s.category}{s.title ? (" · " + s.title) : ""}</span>
                      </div>
                      <span style={{ fontSize: 11, color: T.muted }}>₩{fmt(s.netAmt)}</span>
                    </div>
                  );
                })}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function StatsView(props) {
  const data = props.data, T = props.T;
  const days = data.days, settings = data.settings;
  const [viewYear, setViewYear] = useState(function() { return new Date().getFullYear(); });
  let yearIncome = 0, yearTaxed = 0, yearExpense = 0, yearWorked = 0;
  const monthlyStats = [];
  for (let m = 0; m < 12; m++) {
    const prefix = viewYear + "-" + pad2(m + 1);
    let inc = 0, taxed = 0, exp = 0, worked = 0;
    Object.keys(days).filter(function(k) { return k.indexOf(prefix) === 0; }).forEach(function(k) {
      const d = days[k];
      const w = calcDayHours(d);
      worked += w;
      (d.incomeItems || []).forEach(function(i) { const a = Number(i.amount) || 0; inc += a; taxed += i.taxable ? a * (1 - settings.taxRate / 100) : a; });
      (d.expenseItems || []).forEach(function(i) { exp += Number(i.amount) || 0; });
    });
    yearIncome += inc; yearTaxed += taxed; yearExpense += exp; yearWorked += worked;
    monthlyStats.push({ month: m + 1, inc: inc, taxed: taxed, exp: exp, worked: worked });
  }
  let streak = 0;
  const sortedDayKeys = Object.keys(days).sort().reverse();
  for (let idx = 0; idx < sortedDayKeys.length; idx++) {
    const streakDay = days[sortedDayKeys[idx]];
    const w = calcDayHours(streakDay);
    if (w >= settings.dailyGoalHours && settings.dailyGoalHours > 0) streak++; else break;
  }
  const weekdayStats = [];
  for (let i = 0; i < 7; i++) weekdayStats.push({ day: i, totalIncome: 0, count: 0, totalWorked: 0 });
  Object.keys(days).forEach(function(ds) {
    const d = days[ds];
    const dayIdx = new Date(ds + "T00:00:00").getDay();
    const w = calcDayHours(d);
    const inc = (d.incomeItems || []).reduce(function(s, i) { return s + (Number(i.amount) || 0); }, 0);
    if (w > 0 || inc > 0) { weekdayStats[dayIdx].count++; weekdayStats[dayIdx].totalIncome += inc; weekdayStats[dayIdx].totalWorked += w; }
  });
  const maxWDIncome = Math.max.apply(null, weekdayStats.map(function(w) { return w.count > 0 ? w.totalIncome / w.count : 0; }).concat([1]));
  const expByCat = {};
  settings.expenseCategories.forEach(function(c) { expByCat[c] = 0; });
  Object.keys(days).forEach(function(k) {
    (days[k].expenseItems || []).forEach(function(i) {
      const c = i.category || "기타";
      expByCat[c] = (expByCat[c] || 0) + (Number(i.amount) || 0);
    });
  });
  const maxInc = Math.max.apply(null, monthlyStats.map(function(m) { return m.inc; }).concat([1]));

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
      <div style={T.card}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <button onClick={function() { setViewYear(function(y) { return y - 1; }); }} style={T.navBtn}>‹</button>
          <span style={{ fontWeight: 700, fontSize: 16 }}>{viewYear}년 통계</span>
          <button onClick={function() { setViewYear(function(y) { return y + 1; }); }} style={T.navBtn}>›</button>
        </div>
      </div>
      <div style={T.summaryCard}>
        <div style={T.summaryTitle}>🗓 {viewYear}년 전체</div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(3,1fr)", gap: 10 }}>
          <SI label="총 근무" value={yearWorked.toFixed(0) + "h"} />
          <SI label="총 수입" value={"₩" + fmt(Math.round(yearIncome))} />
          <SI label="세후 수입" value={"₩" + fmt(Math.round(yearTaxed))} color="#4ade80" />
          <SI label="총 지출" value={"₩" + fmt(Math.round(yearExpense))} color="#f87171" />
          <SI label="순수익" value={"₩" + fmt(Math.round(yearTaxed - yearExpense))} color={(yearTaxed - yearExpense >= 0) ? "#4ade80" : "#f87171"} />
          <SI label="연속달성" value={streak + "일 🔥"} color="#facc15" />
        </div>
      </div>
      <div style={T.card}>
        <div style={T.label}>📊 월별 수입</div>
        <div style={{ display: "flex", gap: 4, alignItems: "flex-end", height: 100, marginTop: 8 }}>
          {monthlyStats.map(function(m) {
            return (
              <div key={m.month} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 2 }}>
                <div style={{ width: "100%", background: "linear-gradient(to top,#6366f1,#818cf8)", borderRadius: "3px 3px 0 0", height: Math.max((m.inc / maxInc) * 80, m.inc > 0 ? 4 : 0) + "px", transition: "height 0.3s" }} />
                <div style={{ fontSize: 9, color: T.muted }}>{m.month}월</div>
              </div>
            );
          })}
        </div>
      </div>
      <div style={T.card}>
        <div style={T.label}>📊 요일별 평균 수입</div>
        <div style={{ display: "flex", gap: 4, alignItems: "flex-end", height: 80, marginTop: 8 }}>
          {weekdayStats.map(function(w) {
            const avg = w.count > 0 ? w.totalIncome / w.count : 0;
            return (
              <div key={w.day} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 2 }}>
                <div style={{ width: "100%", background: "linear-gradient(to top,#f97316,#facc15)", borderRadius: "3px 3px 0 0", height: Math.max((avg / maxWDIncome) * 64, avg > 0 ? 4 : 0) + "px", transition: "height 0.3s" }} />
                <div style={{ fontSize: 9, color: T.muted }}>{WEEKDAYS[w.day]}</div>
              </div>
            );
          })}
        </div>
        <div style={{ marginTop: 8, display: "flex", flexDirection: "column", gap: 4 }}>
          {weekdayStats.filter(function(w) { return w.count > 0; }).sort(function(a, b) { return (b.totalIncome / b.count) - (a.totalIncome / a.count); }).slice(0, 3).map(function(w, i) {
            return (
              <div key={w.day} style={{ display: "flex", justifyContent: "space-between", fontSize: 12 }}>
                <span>{i === 0 ? "🥇" : i === 1 ? "🥈" : "🥉"} {WEEKDAYS[w.day]}요일</span>
                <span style={{ color: "#facc15" }}>평균 ₩{fmt(Math.round(w.totalIncome / w.count))}</span>
              </div>
            );
          })}
        </div>
      </div>
      <div style={T.card}>
        <div style={T.label}>💸 지출 카테고리별 합계</div>
        {Object.keys(expByCat).filter(function(c) { return expByCat[c] > 0; }).sort(function(a, b) { return expByCat[b] - expByCat[a]; }).map(function(cat) {
          return (
            <div key={cat} style={{ display: "flex", justifyContent: "space-between", padding: "6px 0", borderBottom: "1px solid " + T.divider }}>
              <span style={{ fontSize: 13 }}>{cat}</span>
              <span style={{ fontSize: 13, color: "#f87171", fontWeight: 600 }}>₩{fmt(expByCat[cat])}</span>
            </div>
          );
        })}
        {Object.keys(expByCat).every(function(c) { return expByCat[c] === 0; }) && <div style={{ color: T.muted, fontSize: 13 }}>지출 내역이 없어요</div>}

}

  const [holidayInput, setHolidayInput] = useState("");
  const [goalDraft, setGoalDraft] = useState(function() { return Object.assign({}, GOAL_DEFAULT, settings.goalProject || {}); });

  function saveGoalProject() {
    const next = Object.assign({}, GOAL_DEFAULT, goalDraft, {
      enabled: true,
      targetAmount: Math.max(0, Number(goalDraft.targetAmount) || 0),
      startingAmount: Math.max(0, Number(goalDraft.startingAmount) || 0),
      dailyAmount: Math.max(0, Number(goalDraft.dailyAmount) || 0)
    });
    if (!next.name.trim() || !next.startDate || next.targetAmount <= 0 || next.dailyAmount <= 0) {
      alert("목표 이름, 목표금액, 하루 목표액, 시작일을 확인하세요.");
      return;
    }
    const workDays = Math.ceil(Math.max(0, next.targetAmount - next.startingAmount) / next.dailyAmount);
    next.originalFinishDate = projectGoalFinish(next.startDate, workDays, data, next);
    updateSettings(function(s) { return Object.assign({}, s, { goalProject: next }); });
    setGoalDraft(next);
  }

  function exportData() {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "work_tracker_backup.json"; a.click();
    URL.revokeObjectURL(url);
  }
  function importData(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
      try {
        const parsed = JSON.parse(ev.target.result);
        if (parsed.days && parsed.settings) {
          localStorage.setItem(STORAGE_KEY, ev.target.result);
          window.location.reload();
        } else {
          alert("올바른 백업 파일이 아니에요!");
        }
      } catch (err) {
        alert("파일을 읽을 수 없어요!");
      }
    };
    reader.readAsText(file);
  }

          <label style={Object.assign({}, T.addBtn, { cursor: "pointer", background: "rgba(250,204,21,0.1)", borderColor: "rgba(250,204,21,0.3)", color: "#facc15" })}>
            📥 백업 파일 불러오기
            <input type="file" accept=".json" style={{ display: "none" }} onChange={importData} />
          </label>
        </div>
        <div style={{ fontSize: 11, color: T.muted, marginTop: 8 }}>데이터를 JSON 파일로 저장하거나 복원할 수 있어요</div>
      </div>
    </div>
  );
}
